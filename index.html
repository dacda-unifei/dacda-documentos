<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DACDA UNIFEI — Portal de Documentação Oficial</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Base documental, estatuto, regimento e transparência do Diretório Acadêmico de Ciência de Dados Aplicada da UNIFEI.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Dark Theme with Cyan/Emerald accents -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.65;
      --theme-color: #0284c7;
      --theme-color-secondary: #10b981;
      
      /* Dark Palette */
      --body-background: #090e1a;
      --content-max-width: 920px;
      --sidebar-background: #060a14;
      --sidebar-border-color: rgba(56, 92, 148, 0.2);
      --sidebar-name-color: #38bdf8;
      --sidebar-nav-link-color: #94a8c8;
      --sidebar-nav-link-color--active: #38bdf8;
      --sidebar-nav-link-border-color--active: #38bdf8;
      --sidebar-nav-link-font-weight--active: 600;
      
      /* Blockquote */
      --blockquote-background: rgba(14, 165, 233, 0.08);
      --blockquote-border-color: #0284c7;
      --blockquote-color: #bae6fd;
      
      /* Tables */
      --table-border-color: rgba(56, 92, 148, 0.24);
      --table-head-background: #0f172a;
      --table-row-odd-background: rgba(15, 23, 42, 0.4);
      
      /* Code */
      --code-inline-background: #1e293b;
      --code-inline-color: #38bdf8;
      --code-theme-background: #0b1120;
    }
    
    .app-name-link img {
      max-height: 38px;
    }
    
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    
    .markdown-section h1 { color: #f8fafc; border-bottom: 2px solid rgba(56, 92, 148, 0.3); padding-bottom: 8px; }
    .markdown-section h2 { color: #e2e8f0; margin-top: 2rem; }
    .markdown-section h3 { color: #cbd5e1; }
    
    .badge-pill {
      display: inline-block;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }
  </style>
</head>
<body>
  <div id="app">Carregando portal institucional do DACDA...</div>
  
  <script>
    window.$docsify = {
      name: 'DACDA UNIFEI',
      repo: 'https://github.com/dacda-unifei/dacda-documentos',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Pesquisar na base documental...',
        noData: 'Nenhum documento encontrado.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: 'Copiado!'
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Próximo',
        crossChapter: true
      }
    };
  </script>
  
  <!-- Docsify Core & Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
